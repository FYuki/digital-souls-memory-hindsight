[project]
name = "digital-souls-memory-hindsight"
version = "0.1.0"
description = "Prototype of the Digital Souls memory domain built around Hindsight"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic==1.16.5",
  "fastapi==0.116.1",
  "hindsight-client==1.1.0",
  "httpx==0.28.1",
  "psycopg[binary]==3.3.6",
  "sqlalchemy==2.0.43",
  "uvicorn==0.35.0",
]

[dependency-groups]
dev = [
  "mypy==1.18.2",
  "pytest==8.4.2",
  "pytest-socket==0.7.0",
  "ruff==0.13.2",
]

[tool.uv]
# プロジェクト自体はビルドしない。ビルド依存はuv.lockのハッシュで検証できないため、
# 導入物をすべてuv.lockの配布物ハッシュで固定する。コードはsrcから直接読み込む。
package = false
# 公開から 7 日以上たった版だけを解決に使う。最新版を自動で使わず、この時点を意識的に上げる
# （手順は README の「依存パッケージの固定」）。上げたら uv lock で uv.lock を作り直す。
exclude-newer = "2026-10-27T00:00:00Z"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "migrations"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--import-mode=importlib --strict-markers --disable-socket --allow-unix-socket -m 'not it2 and not st'"
markers = [
  "ut: isolated unit tests without network",
  "it1: real PostgreSQL and Hindsight with fixture LLM/embedding, without external network",
  "it2: explicitly approved real-model integration (not run in CI)",
  "st: end-to-end tests called from Core (not run in CI)",
]
