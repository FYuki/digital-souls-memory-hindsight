name: Checks

on:
  pull_request:
  push:
    branches: [main, 'epic/**']

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: .python-version
      - name: Install locked toolchain
        run: |
          python -m pip install uv==0.8.22
          uv lock --check
          uv sync --frozen
      - name: Lint, format and strict types
        run: |
          uv run --no-sync ruff check src tests
          uv run --no-sync ruff format --check src tests
          uv run --no-sync mypy
      - name: Required UT (no network)
        run: uv run --no-sync pytest -m 'ut and not it2 and not st' -q
  it1:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build and run isolated IT1
        run: bash scripts/run-it1.sh
